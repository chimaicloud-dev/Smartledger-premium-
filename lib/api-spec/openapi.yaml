openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: CryptoX Exchange API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: User operations
  - name: portfolio
    description: Portfolio operations
  - name: transactions
    description: Transaction operations
  - name: market
    description: Market data operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized or wrong current password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/kyc/verify:
    post:
      operationId: submitKyc
      tags: [auth]
      summary: Submit KYC verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KycSubmitRequest"
      responses:
        "200":
          description: KYC submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /portfolio:
    get:
      operationId: getPortfolio
      tags: [portfolio]
      summary: Get user portfolio
      responses:
        "200":
          description: Portfolio data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"

  /referrals/summary:
    get:
      operationId: getReferralSummary
      tags: [users]
      summary: Get the current user's referral summary
      responses:
        "200":
          description: Referral summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralSummary"

  /loans:
    get:
      operationId: getLoans
      tags: [users]
      summary: List the current user's loans
      responses:
        "200":
          description: Loans
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Loan" }
    post:
      operationId: createLoan
      tags: [users]
      summary: Submit a loan application
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoanApplicationInput" }
      responses:
        "201":
          description: Loan application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Loan" }
        "400":
          description: Invalid application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /loans/{id}/repay:
    post:
      operationId: repayLoan
      tags: [users]
      summary: Repay an approved loan
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Repaid loan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Loan" }
        "400": { description: Invalid state, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Loan not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /admin/loans:
    get:
      operationId: getAdminLoans
      tags: [admin]
      summary: List loan applications
      responses:
        "200":
          description: Loans
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminLoan" }
  /admin/loans/{id}/approve:
    post:
      operationId: approveAdminLoan
      tags: [admin]
      summary: Approve a pending loan
      parameters: [ { $ref: "#/components/parameters/Id" } ]
      responses:
        "200":
          description: Approved loan
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminLoan" } } }
  /admin/loans/{id}/reject:
    post:
      operationId: rejectAdminLoan
      tags: [admin]
      summary: Reject a pending loan
      parameters: [ { $ref: "#/components/parameters/Id" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LoanRejectionInput" } } }
      responses:
        "200":
          description: Rejected loan
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminLoan" } } }
  /admin/loans/{id}/id-number:
    get:
      operationId: getAdminLoanIdNumber
      tags: [admin]
      summary: Reveal a loan application ID number
      parameters: [ { $ref: "#/components/parameters/Id" } ]
      responses:
        "200":
          description: Decrypted identification number
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminLoanIdNumber" } } }

  /investments:
    get:
      operationId: getInvestments
      tags: [investments]
      summary: List the user's investment plans
      responses:
        "200":
          description: List of investments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Investment"
    post:
      operationId: createInvestment
      tags: [investments]
      summary: Invest in a plan (locks capital for 30 days)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvestmentRequest"
      responses:
        "200":
          description: Investment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investment"

  /transactions:
    get:
      operationId: getTransactions
      tags: [transactions]
      summary: Get user transactions
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /transactions/buy:
    post:
      operationId: buyCrypto
      tags: [transactions]
      summary: Buy cryptocurrency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeRequest"
      responses:
        "200":
          description: Trade successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/sell:
    post:
      operationId: sellCrypto
      tags: [transactions]
      summary: Sell cryptocurrency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeRequest"
      responses:
        "200":
          description: Trade successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/deposit:
    post:
      operationId: deposit
      tags: [transactions]
      summary: Deposit funds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositRequest"
      responses:
        "200":
          description: Deposit successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get admin dashboard stats (admin only)
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: List all users (admin only)
      parameters:
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /admin/emails/custom:
    post:
      operationId: sendAdminCustomEmail
      tags: [admin]
      summary: Send a custom email to one user or all users (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCustomEmailInput"
      responses:
        "200":
          description: Email delivery result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCustomEmailResult"
        "400":
          description: Invalid email request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Target user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/emails/jobs/{jobId}:
    get:
      operationId: getAdminCustomEmailJob
      tags: [admin]
      summary: Get custom email delivery progress (admin only)
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Email delivery progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCustomEmailResult"
        "404":
          description: Email job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{id}:
    patch:
      operationId: updateAdminUser
      tags: [admin]
      summary: Update a user (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteAdminUser
      tags: [admin]
      summary: Delete a user (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/users/{id}/preview:
    get:
      operationId: getAdminUserPreview
      tags: [admin]
      summary: Preview a user's registration and account details (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User account preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPreview"
        "400":
          description: Invalid user ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/transactions:
    get:
      operationId: getAdminTransactions
      tags: [admin]
      summary: List all transactions (admin only)
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
        - in: query
          name: userId
          schema:
            type: integer
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminTransaction"

  /admin/transactions/{id}/approve:
    post:
      operationId: approveAdminTransaction
      tags: [admin]
      summary: Approve a pending transaction (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTransaction"

  /admin/transactions/{id}/reject:
    post:
      operationId: rejectAdminTransaction
      tags: [admin]
      summary: Reject a pending transaction (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTransaction"

  /admin/kyc:
    get:
      operationId: getAdminKycQueue
      tags: [admin]
      summary: List users with pending KYC (admin only)
      responses:
        "200":
          description: Pending KYC users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminKycSubmission"

  /admin/kyc/{userId}/id-number:
    get:
      operationId: getAdminKycIdNumber
      tags: [admin]
      summary: Reveal a user's encrypted KYC ID number for manual review
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Decrypted KYC ID number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminKycIdNumber"
        "400":
          description: Invalid user ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User or KYC ID number not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/kyc/{userId}/approve:
    post:
      operationId: approveAdminKyc
      tags: [admin]
      summary: Approve a user's KYC (admin only)
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: KYC approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /admin/kyc/{userId}/reject:
    post:
      operationId: rejectAdminKyc
      tags: [admin]
      summary: Reject a user's KYC (admin only)
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: KYC rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /admin/create-admin:
    post:
      operationId: adminCreateAdmin
      tags: [admin]
      summary: Create or promote an admin account (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateRequest"
      responses:
        "201":
          description: Admin created or promoted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /transactions/convert:
    post:
      operationId: convertCrypto
      tags: [transactions]
      summary: Convert one cryptocurrency to another
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConvertRequest"
      responses:
        "200":
          description: Conversion successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConvertResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /transactions/withdraw:
    post:
      operationId: withdraw
      tags: [transactions]
      summary: Withdraw funds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawRequest"
      responses:
        "200":
          description: Withdrawal submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/withdrawal-addresses:
    get:
      operationId: getWithdrawalAddresses
      tags: [transactions]
      summary: Get the authenticated user's saved withdrawal addresses
      responses:
        "200":
          description: Saved addresses by withdrawal method
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WithdrawalAddress"

  /transactions/withdrawal-addresses/{method}:
    delete:
      operationId: deleteWithdrawalAddress
      tags: [transactions]
      summary: Delete a saved withdrawal address so it can be replaced
      parameters:
        - name: method
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Address deleted

  /market/prices:
    get:
      operationId: getMarketPrices
      tags: [market]
      summary: Get market prices for popular coins
      responses:
        "200":
          description: Market prices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoinPrice"

  /market/forex:
    get:
      operationId: getForexPrices
      tags: [market]
      summary: Get live forex, gold and stock prices
      responses:
        "200":
          description: Forex / commodities / stock prices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoinPrice"

components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: integer, minimum: 1 }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        name:
          type: string
        phone:
          type: string
        country:
          type: string
        dateOfBirth:
          type: string
        timezone:
          type: string
          description: Current IANA timezone reported by the user's device, such as Africa/Lagos.
        referralCode:
          type: string
          minLength: 3
          maxLength: 64
      required:
        - email
        - password
        - name
        - phone
        - country
        - dateOfBirth

    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        timezone:
          type: string
          description: Current IANA timezone reported by the user's device, such as Africa/Lagos.
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        message:
          type: string
      required:
        - user
        - message

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        experience:
          type: string
        usdBalance:
          type: number
        kycStatus:
          type: string
          enum: [unverified, pending, verified, rejected]
        role:
          type: string
          enum: [user, admin]
        status:
          type: string
          enum: [active, suspended]
        createdAt:
          type: string
        referralCode:
          type: string
      required:
        - id
        - email
        - name
        - experience
        - usdBalance
        - kycStatus
        - role
        - status
        - createdAt
        - referralCode

    ReferralSummary:
      type: object
      required: [referralCode, referralCount, referralEarnings]
      properties:
        referralCode: { type: string }
        referralCount: { type: integer }
        referralEarnings: { type: number }

    LoanApplicationInput:
      type: object
      required: [planId, amount, termDays, collateralSymbol, fullName, dateOfBirth, country, residentialAddress, phone, idType, idNumber, employmentStatus, monthlyIncome, purpose]
      properties:
        planId: { type: string, minLength: 1, maxLength: 64 }
        amount: { type: number, exclusiveMinimum: 0 }
        termDays: { type: integer, minimum: 1 }
        collateralSymbol: { type: string, minLength: 2, maxLength: 12 }
        fullName: { type: string, minLength: 2, maxLength: 120 }
        dateOfBirth: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        country: { type: string, minLength: 2, maxLength: 80 }
        residentialAddress: { type: string, minLength: 8, maxLength: 300 }
        phone: { type: string, minLength: 5, maxLength: 40 }
        idType: { type: string, enum: [national_id, drivers_license, passport] }
        idNumber: { type: string, minLength: 3, maxLength: 100 }
        employmentStatus: { type: string, minLength: 2, maxLength: 80 }
        monthlyIncome: { type: number, exclusiveMinimum: 0 }
        purpose: { type: string, minLength: 3, maxLength: 500 }

    LoanRejectionInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }

    Loan:
      type: object
      required: [id, planId, planName, amount, apr, termDays, collateralSymbol, repaymentAmount, status, requestedAt, approvedAt, dueAt, repaidAt, rejectionReason]
      properties:
        id: { type: integer }
        planId: { type: string }
        planName: { type: string }
        amount: { type: number }
        apr: { type: number }
        termDays: { type: integer }
        collateralSymbol: { type: string }
        repaymentAmount: { type: number }
        status: { type: string, enum: [pending, approved, rejected, repaid] }
        requestedAt: { type: string }
        approvedAt: { type: [string, "null"] }
        dueAt: { type: [string, "null"] }
        repaidAt: { type: [string, "null"] }
        rejectionReason: { type: [string, "null"] }

    AdminLoan:
      allOf:
        - $ref: "#/components/schemas/Loan"
        - type: object
          required: [userId, fullName, dateOfBirth, country, residentialAddress, phone, idType, employmentStatus, monthlyIncome, purpose, reviewedByUserId]
          properties:
            userId: { type: integer }
            fullName: { type: string }
